<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UnboxCrew — Unbox the World. Together.</title>

<meta name="description" content="UnboxCrew — aesthetic small group travel experiences.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

<style>

/* =========================================================
   UNBOXCREW
   PREMIUM LIGHT / GEN-Z / TRAVEL
========================================================= */

:root{
    --white:#ffffff;
    --cream:#f8faf8;
    --cream2:#f1f6f5;

    --ink:#142c35;
    --ink2:#26444d;
    --muted:#71848a;

    --blue:#6ca8cc;
    --blue2:#bcdced;
    --blue3:#e8f4fa;

    --mint:#dceee9;
    --green:#376b63;

    --line:rgba(20,44,53,.10);

    --shadow:0 25px 80px rgba(34,67,78,.12);
    --soft-shadow:0 12px 45px rgba(34,67,78,.08);

    --radius:28px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--cream);
    color:var(--ink);
    font-family:"DM Sans",sans-serif;
    overflow-x:hidden;
}

body.modal-open{
    overflow:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

img,
video{
    display:block;
    max-width:100%;
}


/* =========================================================
   PAGE TRANSITION
========================================================= */

#app{
    min-height:100vh;
}

.page-transition{
    animation:pageIn .55s cubic-bezier(.2,.8,.2,1);
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================================
   GLASS NAVBAR — ONLY GLASS ELEMENT
========================================================= */

.navbar-wrap{
    position:fixed;
    top:18px;
    left:0;
    right:0;
    z-index:1000;
}

.navbar{
    width:min(1240px,92%);
    height:70px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px 0 20px;

    background:rgba(255,255,255,.68);
    border:1px solid rgba(255,255,255,.8);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border-radius:22px;

    box-shadow:0 12px 45px rgba(30,66,79,.09);

    transition:.35s ease;
}

.navbar.scrolled{
    background:rgba(255,255,255,.91);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:205px;
}

.logo-mark{
    width:42px;
    height:42px;
    flex-shrink:0;
}

.logo-mark svg{
    width:100%;
    height:100%;
}

.logo-name{
    font-family:"Manrope",sans-serif;
    font-size:21px;
    font-weight:800;
    letter-spacing:-1.5px;
    line-height:1;
}

.logo-name span{
    color:#5b9ac0;
}

.logo-sub{
    font-size:7px;
    font-weight:700;
    letter-spacing:2.3px;
    color:#789096;
    margin-top:5px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:22px;
}

.nav-links a{
    font-size:12px;
    font-weight:700;
    color:#385058;
    position:relative;
    transition:.25s;
}

.nav-links a:after{
    content:"";
    position:absolute;
    height:2px;
    width:0;
    left:50%;
    bottom:-7px;
    background:#5d9fc2;
    transform:translateX(-50%);
    transition:.25s;
}

.nav-links a:hover{
    color:#3d87ad;
}

.nav-links a:hover:after{
    width:100%;
}

.nav-book{
    border:0;
    color:white;
    background:#173943;
    padding:12px 17px;
    border-radius:14px;
    font-weight:700;
    font-size:12px;
    transition:.3s;
}

.nav-book:hover{
    transform:translateY(-2px);
    background:#255561;
}

.mobile-menu{
    display:none;
    border:0;
    background:none;
    font-size:25px;
    color:var(--ink);
}


/* =========================================================
   GLOBAL
========================================================= */

.container{
    width:min(1220px,92%);
    margin:auto;
}

section{
    padding:115px 0;
}

.section-top{
    margin-bottom:50px;
}

.kicker{
    display:flex;
    align-items:center;
    gap:10px;

    color:#68909d;
    font-size:10px;
    font-weight:800;
    letter-spacing:4px;
    text-transform:uppercase;

    margin-bottom:15px;
}

.kicker:before{
    content:"";
    width:30px;
    height:1px;
    background:#72a7bd;
}

.section-title{
    font-family:"Playfair Display",serif;
    font-weight:600;
    font-size:clamp(42px,5vw,68px);
    line-height:.98;
    letter-spacing:-2.5px;
}

.section-title em{
    color:#4d8eaa;
    font-weight:500;
}

.section-description{
    max-width:560px;
    color:var(--muted);
    line-height:1.8;
    font-size:14px;
    margin-top:18px;
}

.center{
    text-align:center;
}

.center .kicker{
    justify-content:center;
}

.center .section-description{
    margin-left:auto;
    margin-right:auto;
}


/* =========================================================
   MOTION TEXT
========================================================= */

.motion-text{
    opacity:0;
    transform:translateY(32px);
    filter:blur(5px);
    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.2,.8,.2,1),
        filter .8s ease;
}

.motion-text.visible{
    opacity:1;
    transform:none;
    filter:blur(0);
}

.delay-1{transition-delay:.08s}
.delay-2{transition-delay:.16s}
.delay-3{transition-delay:.24s}
.delay-4{transition-delay:.32s}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;
    height:850px;
    max-height:950px;

    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;

    background:#e9f5fa;
}

.hero-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    transform:scale(1.03);
}

.hero-light{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(248,251,250,.96) 0%,
            rgba(248,251,250,.80) 28%,
            rgba(248,251,250,.25) 60%,
            rgba(248,251,250,.03) 100%
        );

    z-index:1;
}

.hero-bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:180px;

    background:linear-gradient(
        transparent,
        var(--cream)
    );

    z-index:1;
}

.hero-content{
    position:relative;
    z-index:2;
    width:min(1220px,92%);
    margin:auto;
    padding-top:90px;
}

.hero-small{
    color:#5b7e89;
    font-size:11px;
    font-weight:800;
    letter-spacing:4px;
    text-transform:uppercase;
}

.hero h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(62px,8vw,112px);
    line-height:.88;
    letter-spacing:-5px;
    max-width:750px;
    margin:22px 0;
}

.hero h1 span{
    display:block;
    color:#4c8fae;
    font-style:italic;
}

.hero-description{
    max-width:500px;
    color:#526b73;
    line-height:1.8;
    font-size:15px;
}

.hero-actions{
    display:flex;
    gap:12px;
    margin-top:30px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:16px;
    padding:15px 21px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:13px;
    font-weight:800;
    transition:.3s cubic-bezier(.2,.8,.2,1);
}

.btn-primary{
    color:white;
    background:#173b45;
    box-shadow:0 15px 35px rgba(23,59,69,.17);
}

.btn-primary:hover{
    transform:translateY(-4px);
    box-shadow:0 20px 45px rgba(23,59,69,.23);
}

.btn-soft{
    color:#23434d;
    background:rgba(255,255,255,.75);
    border:1px solid rgba(255,255,255,.95);
}

.btn-soft:hover{
    transform:translateY(-4px);
}

.hero-mini-stats{
    display:flex;
    gap:35px;
    margin-top:42px;
}

.hero-stat strong{
    display:block;
    font-family:"Manrope";
    font-size:22px;
}

.hero-stat span{
    color:#6b7f84;
    font-size:10px;
}

.hero-scroll{
    position:absolute;
    z-index:3;
    bottom:36px;
    right:5%;
    text-align:center;
    color:#53727c;
    font-size:9px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
}

.scroll-dot{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid #83a9b6;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 8px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(7px)}
}


/* =========================================================
   HOME TRIP SECTION
========================================================= */

.trips-home{
    background:var(--cream);
}

.trip-slider-wrap{
    position:relative;
    width:100%;
    overflow:hidden;
    padding:30px 0 80px;
}

.trip-stage{
    position:relative;
    width:100%;
    height:510px;

    display:flex;
    align-items:center;
    justify-content:center;

    perspective:1400px;
    touch-action:pan-y;
    cursor:grab;
}

.trip-stage.dragging{
    cursor:grabbing;
}

.trip-slide{
    position:absolute;

    width:min(430px,72vw);
    height:490px;

    border-radius:31px;
    overflow:hidden;

    background:white;

    box-shadow:0 25px 70px rgba(31,68,81,.16);

    transform-style:preserve-3d;

    user-select:none;

    transition:
        transform .65s cubic-bezier(.2,.8,.2,1),
        opacity .55s ease,
        filter .55s ease;

    will-change:transform;
}

.trip-slide-image{
    height:300px;
    position:relative;
    overflow:hidden;
}

.trip-slide-image img,
.trip-slide-image video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.trip-slide-image:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(transparent 55%,rgba(8,31,38,.25));
}

.trip-badge{
    position:absolute;
    z-index:2;
    top:17px;
    left:17px;

    padding:8px 12px;
    border-radius:11px;

    color:#244650;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(10px);

    font-size:10px;
    font-weight:800;
}

.trip-slide-content{
    padding:21px;
}

.trip-location{
    color:#719099;
    font-size:9px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
}

.trip-slide h3{
    font-family:"Playfair Display",serif;
    font-size:29px;
    margin:7px 0;
}

.trip-one-line{
    color:#718187;
    font-size:12px;
    line-height:1.6;
    min-height:39px;
}

.trip-details{
    display:flex;
    gap:15px;
    margin-top:13px;
    font-size:10px;
    color:#688087;
}

.trip-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:18px;
    padding-top:14px;

    border-top:1px solid var(--line);
}

.trip-price{
    font-size:19px;
    font-weight:800;
}

.trip-price small{
    font-size:9px;
    color:#809095;
    font-weight:500;
}

.trip-arrow{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:#173b45;
    color:white;
    font-size:18px;
}

.slider-hint{
    text-align:center;
    color:#789096;
    font-size:10px;
    letter-spacing:1.5px;
    margin-top:12px;
}

.slider-progress{
    width:160px;
    height:3px;
    background:#d8e5e7;
    margin:14px auto 0;
    border-radius:10px;
    overflow:hidden;
}

.slider-progress span{
    display:block;
    height:100%;
    width:33.33%;
    background:#4e91ae;
    transition:.4s;
}


/* =========================================================
   ADVENTURES
========================================================= */

.adventures{
    background:#edf5f3;
}

.adventure-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.adventure-card{
    position:relative;
    min-height:220px;

    border-radius:25px;
    overflow:hidden;

    background:white;

    box-shadow:0 10px 35px rgba(31,68,81,.06);

    transition:.4s;
}

.adventure-card:hover{
    transform:translateY(-7px);
    box-shadow:var(--shadow);
}

.adventure-icon{
    width:55px;
    height:55px;
    border-radius:17px;
    background:var(--blue3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.adventure-inner{
    padding:28px;
}

.adventure-card h3{
    font-family:"Playfair Display",serif;
    font-size:27px;
    margin:20px 0 8px;
}

.adventure-card p{
    color:#75858a;
    font-size:12px;
    line-height:1.65;
}


/* =========================================================
   GALLERY
========================================================= */

.gallery-section{
    background:#fff;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    grid-auto-rows:160px;
    gap:13px;
}

.gallery-item{
    position:relative;
    overflow:hidden;
    border-radius:22px;
    cursor:pointer;
    background:#dcebee;
}

.gallery-item:nth-child(1){
    grid-column:span 5;
    grid-row:span 2;
}

.gallery-item:nth-child(2){
    grid-column:span 4;
    grid-row:span 2;
}

.gallery-item:nth-child(3){
    grid-column:span 3;
}

.gallery-item:nth-child(4){
    grid-column:span 3;
}

.gallery-item:nth-child(5){
    grid-column:span 4;
}

.gallery-item:nth-child(6){
    grid-column:span 5;
}

.gallery-item img,
.gallery-item video{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.65s cubic-bezier(.2,.8,.2,1);
}

.gallery-item:hover img{
    transform:scale(1.08);
}

.gallery-shade{
    position:absolute;
    inset:0;
    background:linear-gradient(transparent 55%,rgba(15,39,48,.38));
    opacity:.4;
    transition:.3s;
}

.gallery-item:hover .gallery-shade{
    opacity:1;
}

.gallery-play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:54px;
    height:54px;

    border-radius:50%;
    background:rgba(255,255,255,.84);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
}


/* =========================================================
   REVIEWS
========================================================= */

.reviews{
    background:#f4f8f7;
}

.review-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:17px;
}

.review-card{
    background:white;
    border:1px solid var(--line);
    border-radius:25px;
    padding:28px;
    cursor:pointer;
    transition:.35s;
}

.review-card:hover{
    transform:translateY(-7px);
    box-shadow:var(--soft-shadow);
}

.stars{
    color:#d29c44;
    letter-spacing:3px;
    font-size:13px;
}

.review-quote{
    font-family:"Playfair Display",serif;
    font-size:22px;
    line-height:1.4;
    margin:20px 0 25px;
}

.reviewer{
    display:flex;
    align-items:center;
    gap:11px;
}

.avatar{
    width:41px;
    height:41px;
    border-radius:50%;
    background:#dceef2;
    color:#3e778b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.reviewer strong{
    display:block;
    font-size:12px;
}

.reviewer small{
    display:block;
    color:#7d8d92;
    margin-top:3px;
    font-size:10px;
}


/* =========================================================
   ABOUT
========================================================= */

.about{
    background:#fff;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:75px;
    align-items:center;
}

.about-image{
    height:600px;
    border-radius:31px;
    overflow:hidden;
    position:relative;
}

.about-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.about-image-label{
    position:absolute;
    left:22px;
    right:22px;
    bottom:22px;

    padding:21px;

    background:rgba(255,255,255,.84);
    backdrop-filter:blur(14px);

    border-radius:19px;
}

.about-image-label strong{
    font-family:"Playfair Display",serif;
    font-size:23px;
}

.about-image-label span{
    display:block;
    margin-top:5px;
    font-size:10px;
    color:#73868b;
}

.about-copy p{
    color:#708187;
    font-size:14px;
    line-height:1.85;
    margin-top:20px;
}

.about-features{
    display:grid;
    gap:10px;
    margin-top:27px;
}

.about-feature{
    padding:16px 17px;
    border-radius:15px;
    background:#f4f8f7;
    border:1px solid var(--line);
    font-size:12px;
    font-weight:700;
}


/* =========================================================
   FAQ
========================================================= */

.faq{
    background:#edf5f3;
}

.faq-wrap{
    max-width:900px;
    margin:auto;
}

.faq-item{
    border-bottom:1px solid rgba(20,44,53,.12);
}

.faq-question{
    width:100%;
    border:0;
    background:none;
    padding:25px 4px;

    display:flex;
    justify-content:space-between;
    gap:20px;

    text-align:left;

    color:var(--ink);
    font-weight:800;
    font-size:14px;
}

.faq-plus{
    font-size:22px;
    font-weight:400;
    transition:.3s;
}

.faq-answer{
    max-height:0;
    overflow:hidden;
    color:#728187;
    line-height:1.8;
    font-size:13px;
    transition:max-height .4s ease;
}

.faq-item.open .faq-answer{
    max-height:180px;
    padding-bottom:22px;
}

.faq-item.open .faq-plus{
    transform:rotate(45deg);
}


/* =========================================================
   CONTACT
========================================================= */

.contact{
    background:#fff;
}

.contact-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.contact-card{
    background:#f1f7f6;
    border-radius:29px;
    padding:42px;
}

.contact-card h2{
    font-family:"Playfair Display",serif;
    font-size:48px;
    line-height:1;
}

.contact-card p{
    color:#718187;
    font-size:13px;
    line-height:1.8;
    margin:18px 0 25px;
}

.contact-links{
    display:grid;
    gap:11px;
}

.contact-link{
    display:flex;
    align-items:center;
    gap:13px;
    padding:15px;
    border-radius:14px;
    background:white;
    border:1px solid var(--line);
    font-size:12px;
    font-weight:700;
}

.contact-form{
    padding:42px;
    border:1px solid var(--line);
    border-radius:29px;
    background:white;
    box-shadow:var(--soft-shadow);
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:#536c74;
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:7px;
}

.field input,
.field textarea{
    width:100%;
    border:1px solid var(--line);
    outline:none;
    border-radius:13px;
    padding:14px;
    background:#f9fbfa;
    color:var(--ink);
    transition:.2s;
}

.field textarea{
    min-height:110px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus{
    border-color:#76a9bd;
    background:white;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    background:#f1f6f5;
    border-top:1px solid var(--line);
    padding:65px 0 25px;
}

.footer-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr;
    gap:45px;
}

.footer-brand p{
    color:#718187;
    max-width:310px;
    font-size:12px;
    line-height:1.8;
    margin-top:17px;
}

.footer-title{
    font-weight:800;
    font-size:12px;
    margin-bottom:17px;
}

.footer-links{
    display:grid;
    gap:11px;
}

.footer-links a{
    color:#718187;
    font-size:12px;
    transition:.2s;
}

.footer-links a:hover{
    color:#3f849f;
}

.footer-bottom{
    border-top:1px solid var(--line);

.standard-trip-image{
    height:280px;

.standard-trip-image img,

    width:100%;

}

.standard-trip-content{
    padding:22px;

.standard-trip-content h3{

    margin:8px 0;
}

.standard-trip-content p{

    font-size:12px;
    line-height:1.7;
}

.standard-trip-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
}


/* =========================================================
   MODALS
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:3000;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(25,48,57,.38);
    backdrop-filter:blur(13px);
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(980px,100%);
    max-height:90vh;
    overflow:auto;

    position:relative;

    background:white;
    border-radius:30px;

    padding:25px;

    box-shadow:0 30px 100px rgba(20,50,62,.25);

    animation:modalIn .45s cubic-bezier(.2,.8,.2,1);
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.93) translateY(20px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal-close{
    position:absolute;
    right:15px;
    top:15px;

    width:43px;
    height:43px;

    border:0;
    border-radius:50%;

    background:white;
    color:#173b45;

    font-size:23px;

    z-index:5;

    box-shadow:0 7px 25px rgba(20,50,62,.15);
}

.modal-image{

    object-fit:cover;
    border-radius:22px;
}

.trip-detail-image{
    height:400px;

    overflow:hidden;
    margin-bottom:28px;

.trip-detail-image img,
.trip-detail-image video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.detail-kicker{
    color:#65909d;
    font-size:10px;

    letter-spacing:3px;
    text-transform:uppercase;
}

.detail-title{

    font-size:55px;
    line-height:.98;
    margin:10px 0;
}

.detail-line{
    font-family:"Playfair Display",serif;

    color:#568ba2;
    font-size:20px;
    margin:15px 0;
}

.detail-description{
    max-width:700px;
    color:#718187;
    line-height:1.8;
    font-size:13px;
}

.detail-pills{
    display:flex;

    flex-wrap:wrap;

}

    background:#edf5f3;

    font-size:10px;
    font-weight:800;
}

.itinerary-title{
    font-family:"Playfair Display",serif;
    font-size:30px;

.day-row{
    border:1px solid var(--line);

    padding:16px;
    margin-bottom:9px;
}

.day-row strong{
    display:block;
    font-size:11px;
    letter-spacing:1px;
    margin-bottom:5px;
}

.day-row span{
    color:#718187;
    font-size:12px;
    line-height:1.6;
}

.review-modal-quote{
    font-family:"Playfair Display",serif;
    font-size:30px;
    line-height:1.4;
    margin:25px 0;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    z-index:5000;

    padding:13px 19px;

    color:white;
    background:#173b45;

    border-radius:14px;

    font-size:12px;

    transform:translate(-50%,120px);
    transition:.35s;
}

.toast.show{
    transform:translate(-50%,0);
}

/* =========================================================
   3D SONG-LIKE CAROUSEL
========================================================= */

let currentTrip=0;
let tripDragStart=0;
let tripDragging=false;
let tripDragDistance=0;


function setup3DCarousel(){

const stage=document.getElementById("tripStage");

if(!stage)return;

const slides=[...stage.querySelectorAll(".trip-slide")];

function updateSlides(){

const total=slides.length;

slides.forEach((slide,index)=>{

let offset=index-currentTrip;

if(offset>total/2){
    offset-=total;
}

if(offset<-total/2){
    offset+=total;
}

const abs=Math.abs(offset);

let x=offset*350;

let rotate=offset*-23;

let scale=1-abs*.13;

let z=100-abs*100;

let opacity=abs>2?0:1;

let blur=abs>1?"blur(2px)":"blur(0)";

slide.style.transform=
`translateX(${x}px) translateZ(${z}px) rotateY(${rotate}deg) scale(${scale})`;

slide.style.opacity=opacity;

slide.style.filter=blur;

slide.style.zIndex=100-abs;

});

const progress=document.getElementById("tripProgress");

if(progress){
    progress.style.width=
    `${((currentTrip+1)/total)*100}%`;
}

}

stage.updateCarousel=updateSlides;

updateSlides();


/* pointer drag */

stage.addEventListener("pointerdown",e=>{

tripDragging=true;

tripDragStart=e.clientX;

tripDragDistance=0;

stage.classList.add("dragging");

stage.setPointerCapture(e.pointerId);

});


stage.addEventListener("pointermove",e=>{

if(!tripDragging)return;

tripDragDistance=e.clientX-tripDragStart;

});


stage.addEventListener("pointerup",()=>{

if(!tripDragging)return;

tripDragging=false;

stage.classList.remove("dragging");

if(Math.abs(tripDragDistance)>55){

if(tripDragDistance<0){
    nextTrip();
}else{
    previousTrip();
}

}

});


stage.addEventListener("pointercancel",()=>{

tripDragging=false;

stage.classList.remove("dragging");

});


/* wheel */

stage.addEventListener("wheel",e=>{

if(Math.abs(e.deltaX)>20 || Math.abs(e.deltaY)>30){

e.preventDefault();

if(e.deltaX>0 || e.deltaY>0){
    nextTrip();
}else{
    previousTrip();
}

}

},{passive:false});

}


function nextTrip(){

const total=siteData.trips.length;

currentTrip=(currentTrip+1)%total;

const stage=document.getElementById("tripStage");

if(stage && stage.updateCarousel){
    stage.updateCarousel();
}

}


function previousTrip(){

const total=siteData.trips.length;

currentTrip=(currentTrip-1+total)%total;

const stage=document.getElementById("tripStage");

if(stage && stage.updateCarousel){
    stage.updateCarousel();
}

}


function tripCardClicked(index){

if(tripDragging)return;

if(index===currentTrip){

openTrip(index);

}else{

currentTrip=index;

const stage=document.getElementById("tripStage");

if(stage && stage.updateCarousel){
    stage.updateCarousel();
}

}

}

========================================================= */

function activateMotion(){

const observer=new IntersectionObserver(

entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.classList.add("visible");

}

});

},

{
threshold:.10
}

);


document
.querySelectorAll(".motion-text")
.forEach(el=>observer.observe(el));

}

}

else if(route==="adventures"){

app.innerHTML=adventuresPage();

}

else if(route==="gallery"){

app.innerHTML=galleryPage();

}

else if(route==="reviews"){

app.innerHTML=reviewsPage();

}

else if(route==="about"){

app.innerHTML=aboutPage();

}

else if(route==="faq"){

app.innerHTML=faqPage();

}

else if(route==="contact"){

app.innerHTML=contactPage();

}

else if(route.startsWith("trip/")){

const id=route.split("/")[1];

const index=siteData.trips.findIndex(t=>t.id===id);

if(index>=0){

app.innerHTML=tripsPage();

setTimeout(()=>openTrip(index),100);

}else{

app.innerHTML=homePage();

renderTripCarousel();

}

}

else{

app.innerHTML=homePage();

renderTripCarousel();

}


/* page always starts from top */

window.scrollTo({
top:0,
behavior:"instant"
});


/* activate text */

setTimeout(activateMotion,50);

}


/* =========================================================
   HASH NAVIGATION
========================================================= */

window.addEventListener("hashchange",renderRoute);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

const toast=document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer=setTimeout(()=>{

toast.classList.remove("show");

},2500);

}


/* =========================================================
   START
========================================================= */

renderRoute();


</script>
